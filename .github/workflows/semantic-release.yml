name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    env:
      HUSKY: "0"
    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SUMURAI_SEMANTIC_RELEASE }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Run Semantic Release
        id: semantic
        run: |
          bun run release
          tag=$(git tag --points-at HEAD 2>/dev/null | grep -E '^v[0-9]' | head -1)
          if [ -n "$tag" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${tag#v}" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.SUMURAI_SEMANTIC_RELEASE }}

  dispatch-publish-images:
    name: Dispatch publish-images
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch publish-images workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.release.outputs.version }}
        run: |
          echo "Dispatching publish-images for tag: ${TAG}"
          gh workflow run .github/workflows/publish-images.yml \
            --repo "${{ github.repository }}" \
            --ref "${TAG}"
