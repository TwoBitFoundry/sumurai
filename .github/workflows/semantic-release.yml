name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Disable git hooks completely
        run: |
          rm -rf .git/hooks
          mkdir -p .git/hooks
          git config core.hooksPath /dev/null

      - name: Run Semantic Release
        id: semantic
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMURAI_SEMANTIC_RELEASE }}

  dispatch-publish-images:
    name: Dispatch publish-images
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch publish-images workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.release.outputs.version }}
        run: |
          echo "Dispatching publish-images for tag: ${TAG}"
          gh workflow run .github/workflows/publish-images.yml \
            --repo "${{ github.repository }}" \
            --ref "${TAG}"
