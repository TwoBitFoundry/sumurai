name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: resolve-tag
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ steps.release.outputs['.--tag_name'] }}"
          fi
          if [ -z "$tag" ]; then
            echo "ERROR: tag_name is empty — cannot dispatch publish-images"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Update autorelease label
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          pr=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state merged \
            --label "autorelease: pending" \
            --json number \
            --jq 'first(.[] | .number)')
          if [ -n "$pr" ]; then
            gh label create "autorelease: tagged" --repo "${{ github.repository }}" --color "0075ca" --force || true
            gh pr edit "$pr" \
              --repo "${{ github.repository }}" \
              --remove-label "autorelease: pending" \
              --add-label "autorelease: tagged"
          fi

  dispatch-publish-images:
    name: Dispatch publish-images
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch publish-images workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "Dispatching publish-images for tag: ${TAG}"
          gh workflow run .github/workflows/publish-images.yml \
            --repo "${{ github.repository }}" \
            --ref "${TAG}"
