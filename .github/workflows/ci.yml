name: ci

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-24.04
    if: "${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease: pending')) }}"
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'backend/Dockerfile'
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'DESIGN.md'
              - '.github/workflows/**'

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo check
        run: cargo check --workspace --locked --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --locked --all-targets --no-deps -- -D warnings

      - name: Cargo test
        env:
          RUST_BACKTRACE: 1
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.playwright-browsers
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Biome check (format + lint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Design guard
        run: npm run design:guard

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: frontend/.playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Storybook Vitest
        run: npm run test:storybook

      - name: Storybook static build
        run: npm run storybook:build

      - name: Storybook iframe smoke
        run: npm run test:storybook-runtime:run
