name: ci

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-24.04
    if: "${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && !contains(join(github.event.pull_request.labels.*.name, ','), 'autorelease: pending')) }}"
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/bun.lock'
              - 'frontend/tsconfig**'
              - 'frontend/next.config**'
              - 'frontend/tailwind**'
              - 'frontend/biome**'
              - 'frontend/vite**'
              - 'frontend/playwright**'
              - 'frontend/.storybook/**'
              - 'DESIGN.md'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo check
        run: cargo check --workspace --locked --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --locked --all-targets --no-deps -- -D warnings

      - name: Cargo test
        env:
          RUST_BACKTRACE: 1
        run: cargo test --workspace --locked

  frontend-check:
    name: Frontend (check)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Biome check (format + lint)
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Design guard
        run: bun run design:guard

      - name: Unit tests
        run: bun run test:ci

  frontend-build:
    name: Frontend (build + storybook)
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.playwright-browsers
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/bun.lock') }}-${{ hashFiles('frontend/src/**/*.ts', 'frontend/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Production build
        run: bun run build

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bun -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: frontend/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system dependencies
        run: bunx playwright install-deps chromium

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Storybook Vitest
        run: bun run test:storybook

      - name: Storybook static build
        run: bun run storybook:build

      - name: Storybook iframe smoke
        run: bun run test:storybook-runtime:run
