name: sumurai

services:
  frontend:
    image: ${SUMURAI_GHCR_PREFIX:-ghcr.io/twobitfoundry/sumurai}-frontend:${SUMURAI_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      NEXT_PUBLIC_OTEL_ENABLED: "false"
      NEXT_PUBLIC_OTEL_SERVICE_NAME: sumurai-frontend
      NEXT_PUBLIC_OTEL_SERVICE_VERSION: "1.0.0"
      NEXT_PUBLIC_OTEL_CAPTURE_BODIES: "false"
      NEXT_PUBLIC_OTEL_BLOCK_SENSITIVE_ENDPOINTS: "true"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    image: ${SUMURAI_GHCR_PREFIX:-ghcr.io/twobitfoundry/sumurai}-backend:${SUMURAI_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-accounting}
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
      MIGRATION_ARTIFACTS_DIR: /var/lib/sumurai/migration

      AUTH_COOKIE_SAME_SITE: Strict
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080},${NGROK_URL:-}

      OTEL_TRACES_EXPORTER: none

      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: production

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      RUST_LOG: info,otel::tracing=trace,axum_tracing_opentelemetry=trace
    volumes:
      - migration_artifacts:/var/lib/sumurai/migration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data_oss:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data_oss:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accounting" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SSL_PORT: ${SSL_PORT:-8443}
    command: [ "/bin/sh", "/etc/nginx/entrypoint.sh" ]
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.slim.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./nginx/healthcheck.sh:/etc/nginx/healthcheck.sh:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    healthcheck:
      test: [ "CMD", "/bin/sh", "/etc/nginx/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:v4.2.0
    pull_policy: always
    profiles: [ "certbot" ]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: [ "sh", "-c", "sleep infinity" ]

  ngrok:
    image: ngrok/ngrok:3.29.0-alpine
    pull_policy: always
    profiles:
      - ngrok
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_URL: ${NGROK_URL:-}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        if [ -n "$$NGROK_URL" ]; then
          exec ngrok http --url="$$NGROK_URL" https://nginx:443
        fi
        exec ngrok http https://nginx:443

volumes:
  redis_data_oss:
  postgres_data_oss:
  migration_artifacts:
  certbot-etc:
  certbot-var:
