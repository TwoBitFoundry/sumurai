name: sumurai

services:
  frontend:
    image: ${SUMURAI_GHCR_PREFIX:-ghcr.io/twobitfoundry/sumurai}-frontend:${SUMURAI_IMAGE_TAG:-latest}
    pull_policy: missing
    environment:
      DEFAULT_PROVIDER: teller
      NEXT_PUBLIC_OTEL_ENABLED: "false"
      NEXT_PUBLIC_OTEL_SERVICE_NAME: sumurai-frontend
      NEXT_PUBLIC_OTEL_SERVICE_VERSION: "1.0.0"
      NEXT_PUBLIC_OTEL_CAPTURE_BODIES: "false"
      NEXT_PUBLIC_OTEL_BLOCK_SENSITIVE_ENDPOINTS: "true"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    image: ${SUMURAI_GHCR_PREFIX:-ghcr.io/twobitfoundry/sumurai}-backend:${SUMURAI_IMAGE_TAG:-latest}
    pull_policy: missing
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-accounting}

      AUTH_COOKIE_SAME_SITE: Strict

      OTEL_TRACES_EXPORTER: none

      DEFAULT_PROVIDER: teller

      TELLER_APPLICATION_ID: ${TELLER_APPLICATION_ID}
      TELLER_CERT_PATH: /etc/teller/certificate.pem
      TELLER_KEY_PATH: /etc/teller/private_key.pem
      TELLER_ENV: development

      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: development

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      RUST_LOG: info,otel::tracing=trace,axum_tracing_opentelemetry=trace
    volumes:
      - ${TELLER_CERT_PATH:?TELLER_CERT_PATH is required}:/etc/teller/certificate.pem:ro
      - ${TELLER_KEY_PATH:?TELLER_KEY_PATH is required}:/etc/teller/private_key.pem:ro
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        sqlx migrate run &&
        echo 'Starting backend server...' &&
        exec ./sumurai-backend
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accounting" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DOMAIN: localhost
      SSL_PORT: 8443
    command: [ "/bin/sh", "/etc/nginx/entrypoint.sh" ]
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.slim.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./nginx/healthcheck.sh:/etc/nginx/healthcheck.sh:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    healthcheck:
      test: [ "CMD", "/bin/sh", "/etc/nginx/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    profiles: [ "certbot" ]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: [ "sh", "-c", "sleep infinity" ]

volumes:
  redis_data:
  postgres_data:
  certbot-etc:
  certbot-var:
