[package]
name = "sumurai-cli"
version = "6.0.0"
edition = "2021"

[lib]
name = "sumurai_cli"
path = "src/lib.rs"

[[bin]]
name = "sumurai"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
entity = { path = "../backend/entity" }
sea-orm = { version = "1", features = ["runtime-tokio-rustls", "sqlx-postgres", "with-uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
