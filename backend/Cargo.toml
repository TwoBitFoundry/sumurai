[package]
name = "sumurai-backend"
version = "7.3.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.42", features = ["serde"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
anyhow = "1.0"
sea-orm = { version = "1", features = ["runtime-tokio-rustls", "sqlx-postgres", "with-uuid", "with-chrono", "with-rust_decimal", "with-json", "macros", "mock"] }
entity = { path = "entity" }
migration = { path = "migration" }
# Package-specific dependencies not in workspace
rust_decimal_macros = "1.40"
hyper = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
aes-gcm = "0.11"
base64 = "0.22"
cookie = "0.18"
hex = "0.4"
rand = "0.10"
redis = { version = "1.4", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.5"
sha2 = "0.11"
csv = "1.3.1"
ofx-rs = "0.1"
futures = "0.3"
governor = "0.10.4"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry-proto = "0.32"
prost = "0.14"
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = "0.3"
axum-tracing-opentelemetry = "0.38"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["api-24", "load-dynamic", "ndarray"] }
tokenizers = { version = "0", default-features = false, features = ["onig"] }
ndarray = "0.17"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
url = "2.5.8"
chrono-tz = "0.10.4"
quick-xml = "0.40.1"
regex = "1.12.3"
once_cell = "1.21.4"
unicode-normalization = "0.1.25"
hmac = "0.13.0"
subtle = "2.6.1"

[features]
default = []
dev-seed = []

[dev-dependencies]
mockall = "0.15"
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
