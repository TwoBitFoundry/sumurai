name: sumurai-phase5-test

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "${PHASE5_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - phase5_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accounting" ]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${PHASE5_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  phase5_postgres_data:
