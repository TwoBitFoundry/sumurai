name: sumurai

services:
  frontend:
    image: ${SUMURAI_GHCR_PREFIX:-ghcr.io/twobitfoundry/sumurai}-frontend:${SUMURAI_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      NEXT_PUBLIC_OTEL_ENABLED: "true"
      NEXT_PUBLIC_OTEL_SERVICE_NAME: sumurai-frontend
      NEXT_PUBLIC_OTEL_SERVICE_VERSION: "1.0.0"
      NEXT_PUBLIC_OTEL_CAPTURE_BODIES: "false"
      NEXT_PUBLIC_OTEL_BLOCK_SENSITIVE_ENDPOINTS: "true"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health" ]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    image: ${SUMURAI_GHCR_PREFIX:-ghcr.io/twobitfoundry/sumurai}-backend:${SUMURAI_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-accounting}
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
      MIGRATION_ARTIFACTS_DIR: /var/lib/sumurai/migration

      AUTH_COOKIE_SAME_SITE: Strict
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}

      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq/ingest/otlp/v1/traces
      OTEL_EXPORTER_OTLP_HEADERS: X-Seq-ApiKey=${SEQ_API_KEY:?SEQ_API_KEY is required}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_STARTUP_TEST_SPAN: "0"

      TELLER_APPLICATION_ID: ${TELLER_APPLICATION_ID}
      TELLER_CERT_PATH: /etc/teller/certificate.pem
      TELLER_KEY_PATH: /etc/teller/private_key.pem
      TELLER_ENV: production

      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: production

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      RUST_LOG: info,otel::tracing=trace,axum_tracing_opentelemetry=trace
    volumes:
      - .certs/teller/certificate.pem:/etc/teller/certificate.pem:ro
      - .certs/teller/private_key.pem:/etc/teller/private_key.pem:ro
      - migration_artifacts:/var/lib/sumurai/migration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      seq:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accounting" ]
      interval: 5s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:2025.2
    pull_policy: if_not_present
    environment:
      ACCEPT_EULA: "Y"
      SEQ_INGESTION__OTLP__ENABLED: "true"
      SEQ_PASSWORD: ${SEQ_PASSWORD:?SEQ_PASSWORD is required}
    volumes:
      - seq_data:/data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required for production}
      ENVIRONMENT: production
      SSL_PORT: 443
    command: [ "/bin/sh", "/etc/nginx/entrypoint.sh" ]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./nginx/healthcheck.sh:/etc/nginx/healthcheck.sh:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    healthcheck:
      test: [ "CMD", "/bin/sh", "/etc/nginx/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    pull_policy: always
    profiles: [ "certbot" ]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: [ "sh", "-c", "sleep infinity" ]

volumes:
  redis_data:
  postgres_data:
  migration_artifacts:
  seq_data:
  certbot-etc:
  certbot-var:
