name: sumurai

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_OTEL_ENABLED: "true"
        NEXT_PUBLIC_OTEL_SERVICE_NAME: sumurai-frontend
        NEXT_PUBLIC_OTEL_SERVICE_VERSION: "1.0.0"
        NEXT_PUBLIC_OTEL_CAPTURE_BODIES: "false"
        NEXT_PUBLIC_OTEL_BLOCK_SENSITIVE_ENDPOINTS: "true"
    environment:
      NEXT_PUBLIC_OTEL_ENABLED: "true"
      NEXT_PUBLIC_OTEL_SERVICE_NAME: sumurai-frontend
      NEXT_PUBLIC_OTEL_SERVICE_VERSION: "1.0.0"
      NEXT_PUBLIC_OTEL_CAPTURE_BODIES: "false"
      NEXT_PUBLIC_OTEL_BLOCK_SENSITIVE_ENDPOINTS: "true"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/" ]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        CARGO_FEATURES: dev-seed
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-accounting}
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
      MIGRATION_ARTIFACTS_DIR: /var/lib/sumurai/migration

      AUTH_COOKIE_SAME_SITE: Lax
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080,http://localhost:3001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3001},${NGROK_URL:-}

      OTEL_TRACES_EXPORTER: console

      TELLER_APPLICATION_ID: ${TELLER_APPLICATION_ID}
      TELLER_CERT_PATH: /etc/teller/certificate.pem
      TELLER_KEY_PATH: /etc/teller/private_key.pem
      TELLER_ENV: sandbox

      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SECRET: ${PLAID_SECRET}
      PLAID_ENV: sandbox

      SYNC_DAILY_LIMIT: ${SYNC_DAILY_LIMIT:-24}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      SEED_DEMO_USER: "true"
      RUST_LOG: info,otel::tracing=trace,axum_tracing_opentelemetry=trace
    volumes:
      - .certs/teller/certificate.pem:/etc/teller/certificate.pem:ro
      - .certs/teller/private_key.pem:/etc/teller/private_key.pem:ro
      - migration_artifacts:/var/lib/sumurai/migration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accounting" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SSL_PORT: ${SSL_PORT:-8443}
    command: [ "/bin/sh", "/etc/nginx/entrypoint.sh" ]
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.slim.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./nginx/healthcheck.sh:/etc/nginx/healthcheck.sh:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    healthcheck:
      test: [ "CMD", "/bin/sh", "/etc/nginx/healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    profiles: [ "certbot" ]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: [ "sh", "-c", "sleep infinity" ]

  ngrok:
    image: ngrok/ngrok:latest
    profiles:
      - ngrok
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_URL: ${NGROK_URL:-}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        if [ -n "$$NGROK_URL" ]; then
          exec ngrok http --url="$$NGROK_URL" https://nginx:443
        fi
        exec ngrok http https://nginx:443

volumes:
  redis_data_dev:
  postgres_data_dev:
  migration_artifacts:
  certbot-etc:
  certbot-var:
